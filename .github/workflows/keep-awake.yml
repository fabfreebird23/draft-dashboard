# Keep the Streamlit Cloud app from going to sleep.
#
# Community Cloud parks an app that has had no traffic for a while, and waking
# it takes 30-60 seconds — which is the difference between the phone app being
# usable on a Sunday and not. A request every ten minutes is enough to keep it
# resident; GitHub's scheduler is best-effort and sometimes late, which is fine
# for this (a few minutes of drift costs nothing).
#
# Streamlit answers a cookie-less request with a 303 to its own /-/login
# handshake — that is the ANONYMOUS session bootstrap, not a sign-in wall, so
# the ping has to carry a cookie jar and follow it or it looks like a failure
# and never reaches the app.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://draft-dashboar-kbqgjjbr3vu9gu4bivzev4.streamlit.app' }}
        run: |
          jar=$(mktemp)
          code=$(curl -sSL -c "$jar" -b "$jar" -o /dev/null -w '%{http_code}' \
                  --max-time 90 -A 'bloody-sunday-keepalive' "$APP_URL/" || echo 000)
          echo "app -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::App answered $code — it may be asleep, private, or broken."
          fi
